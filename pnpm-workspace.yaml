# Settings only (no packages list). pnpm 10 reads the release-age gate from this
# file, not from the package.json "pnpm" field. scripts/test-package.mjs links
# the consumer's dependencies from this repo's install, so it needs no copy.
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - "@vllnt/*"
